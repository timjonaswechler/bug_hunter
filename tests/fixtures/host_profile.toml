version = 1
profile_id = "automation-test-v1"

[tool]
name = "automation_debug"
about = "Control the automation test application"
default_artifact_dir = "artifacts/automation-test"

[application]
package = "bevy_test_apps"
kind = "binary"
target = "logical_state"
features = ["automation"]
arguments = []
mode_argument = "--controlled-mode"

[session]
id = "test-session"
default_mode = "rendered"
surface_width = 640
surface_height = 360
frame_nanoseconds = 16666667
startup_frames = 1

[report]
generated_by = "automation_debug report"

[screen]
target = "session.status"
component = "test_app::SessionObservation"
value_pointer = "/active_screen"
result_field = "active_screen"
