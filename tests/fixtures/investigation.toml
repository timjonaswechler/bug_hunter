version = 1

[launch]
manifest_path = "bevy_test_apps/Cargo.toml"
package = "bevy_test_apps"
features = ["slice"]
arguments = ["--investigation"]

[launch.target]
kind = "binary"
name = "logical_state"

[tick.pace]
kind = "as_fast_as_possible"

[report]
tracing_errors = true
output = "reports"

[report.provider]
kind = "local"
