[package]
name = "bevy_test_apps"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
bevy = { version = "0.19.1", features = [] }
woodpecker = { path = "../", features = ["ui", "screenshot"] }
rand = "0.9"
rand_10 = { package = "rand", version = "0.10" }
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }

[features]
default = []
# Legacy compile-time switch for the other existing controlled fixtures.
# Alien Cake selects session mode at runtime; it does not require this feature.
slice = []

[[bin]]
name = "context_menu"
path = "src/bin/context_menu.rs"

[[bin]]
name = "blend_modes"
path = "src/bin/blend_modes.rs"

[[bin]]
name = "mesh_picking"
path = "src/bin/mesh_picking.rs"

[[bin]]
name = "game_menu"
path = "src/bin/game_menu.rs"

[[bin]]
name = "ui_drag_drop"
path = "src/bin/ui_drag_drop.rs"

[[bin]]
name = "logical_state"
path = "src/bin/logical_state.rs"

[[bin]]
name = "alien_cake_addict"
path = "src/bin/alien_cake_addict.rs"

[[bin]]
name = "counter"
path = "src/bin/counter.rs"
required-features = ["slice"]
