[package]
name = "automation_control"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Debug Host process management and controller workflows.
host = ["dep:clap", "dep:ctrlc", "dep:toml"]
# Compatibility alias for callers that still enable the former feature name.
driver = ["host"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_input_focus", "bevy_ui", "bevy_picking", "bevy_window", "bevy_render", "debug"] }
cap-std = "4.0"
clap = { version = "4.5", features = ["derive", "string"], optional = true }
ctrlc = { version = "3.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", optional = true }

[[example]]
name = "bevy_controller"
required-features = ["host"]

[[example]]
name = "picking_controller"
required-features = ["host"]

[[example]]
name = "blend_modes_controller"
required-features = ["host"]

[[example]]
name = "game_menu_controller"
required-features = ["host"]

[[example]]
name = "ui_drag_drop_controller"
required-features = ["host"]

[[example]]
name = "render_readiness_stress"
required-features = ["host"]

[[test]]
name = "driver_recording"
required-features = ["host"]

[[test]]
