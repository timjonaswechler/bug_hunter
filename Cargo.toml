[package]
name = "woodpecker"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
ui = ["bevy/bevy_ui", "bevy/bevy_input_focus"]
screenshot = ["bevy/bevy_render", "dep:image"]
server = ["dep:axum", "dep:tokio", "dep:getrandom"]
client = ["server", "dep:ureq", "dep:tungstenite"]
cli = ["client", "dep:clap", "dep:toml"]

[dependencies]
cap-std = "3"
cap-fs-ext = "3"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"], optional = true }
getrandom = { version = "0.4", optional = true }
ureq = { version = "3", default-features = false, features = ["json"], optional = true }
tungstenite = { version = "0.29", optional = true }
libc = "0.2"
bevy = { version = "0.19.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_window", "bevy_camera", "bevy_picking", "mouse", "keyboard", "touch", "debug"] }
clap = { version = "4.5", features = ["derive", "string"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = { version = "0.8", optional = true }

[[bin]]
name = "woodpecker"
path = "src/cli/main.rs"
required-features = ["cli"]
